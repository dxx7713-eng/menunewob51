<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV MOBILE UI</title>
<style>
body{margin:0;font-family:Arial;background:radial-gradient(circle,#200000,#000);color:#fff}
.phone{max-width:420px;margin:auto;height:100vh;border-left:3px solid red;border-right:3px solid red}
.container{display:flex;height:100%}
.left{width:40%;padding:15px;border-right:3px solid red}
.logo{border:2px solid red;padding:18px;border-radius:15px;text-align:center;font-size:20px;margin-bottom:15px}
.menu-btn{border:2px solid red;padding:18px;border-radius:25px;margin:12px 0;text-align:center;cursor:pointer}
.active{background:#600000}
.right{width:60%;padding:15px}
.title{text-align:center;color:red;font-size:26px;margin-bottom:20px}
.row{display:flex;justify-content:space-between;margin:25px 0}
.toggle{width:90px;height:40px;border-radius:25px;border:2px solid red;display:flex;align-items:center;justify-content:center;cursor:pointer}
.on{background:red;box-shadow:0 0 15px red}
.slider{width:100%}
.crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:25px;height:25px;display:none}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:red}
.crosshair:before{width:3px;height:25px;left:11px}
.crosshair:after{height:3px;width:25px;top:11px}
</style>
</head>
<body>
<div class="phone">
<div class="container">
<div class="left">
<div class="logo">𝐇𝐀𝐂𝐕𝐄👑</div>
<div class="menu-btn active" onclick="showTab('gaming')">𝐆𝐀𝐌𝐈𝐍𝐆🎮</div>
<div class="menu-btn" onclick="showTab('optimize')">𝐎𝐏𝐓𝐈𝐌𝐈𝐙𝐄🎯</div>
<div class="menu-btn" onclick="showTab('dpi')">𝐃𝐏𝐈⚙️</div>
</div>
<div class="right">
<div id="gaming" class="tab">
<div class="title">𝐆𝐀𝐌𝐈𝐍𝐆</div>
<div class="row"><span>𝐍𝐡𝐞̣ 𝐓𝐚̂𝐦</span><div class="toggle" onclick="toggle(this)">OFF</div></div>
<div class="row"><span>𝐀𝐢𝐦𝐋𝐨𝐜𝐤</span><div class="toggle" onclick="toggle(this)">OFF</div></div>
<div class="row"><span>𝐀𝐢𝐦𝐁𝐨𝐭</span><div class="toggle" onclick="toggle(this)">OFF</div></div>
</div>
<div id="optimize" class="tab" style="display:none;">
<div class="title">𝐎𝐏𝐓𝐈𝐌𝐈𝐙𝐄</div>
<div class="row"><span>𝐓𝐚̂𝐦 𝐀̉𝐨</span><div class="toggle" onclick="toggle(this,'crosshair')">OFF</div></div>
<div class="row"><span>𝐍𝐨𝐫𝐞𝐜𝐨𝐢𝐥</span><div class="toggle" onclick="toggle(this)">OFF</div></div>
<div class="row"><span>𝐇𝐞𝐚𝐝𝐋𝐨𝐜𝐤</span><div class="toggle" onclick="toggle(this)">OFF</div></div>
</div>
<div id="dpi" class="tab" style="display:none;">
<div class="title">𝐃𝐏𝐈</div>
<div class="row"><span>𝐃𝐏𝐈: <span id="dpiValue">𝟔𝟎</span></span></div>
<input type="range" min="0" max="120" value="60" class="slider" oninput="updateDPI(this.value)">
<div class="row"><span>𝐓𝐫𝐨̛̣ 𝐍𝐚̆𝐧𝐠</span><div class="toggle on" onclick="toggle(this)">ON</div></div>
</div>
</div>
</div>
</div>
<div id="crosshair" class="crosshair"></div>
<script>
function toggle(el,targetId){
if(el.classList.contains("on")){
el.classList.remove("on");el.innerText="OFF";
if(targetId){document.getElementById(targetId).style.display="none";}
}else{
el.classList.add("on");el.innerText="ON";
if(targetId){document.getElementById(targetId).style.display="block";}
}}
function showTab(tab){
document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
document.getElementById(tab).style.display='block';
document.querySelectorAll('.menu-btn').forEach(btn=>btn.classList.remove('active'));
event.target.classList.add('active');
}
function updateDPI(val){
document.getElementById("dpiValue").innerText=val;
}
</script>
</body>
</html>
